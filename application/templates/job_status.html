<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Processing Road Audit Job</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --concrete:#dedbd3;
  --concrete-2:#cfccc3;
  --asphalt:#26292d;
  --tarmac:#34383d;
  --tarmac-2:#41464c;
  --paint:#f4c20d;
  --chalk:#f3f1ea;
  --ink:#1b1d20;
  --muted:#8f949b;
  --survey:#5fb3c4;
  --high:#ff7b66;
}
*{box-sizing:border-box;margin:0}
html{font-family:'Barlow',system-ui,sans-serif;color:var(--ink)}
body{
  min-height:100vh;display:flex;flex-direction:column;
  background-color:var(--concrete);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .2  0 0 0 0 .2  0 0 0 0 .2  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  -webkit-font-smoothing:antialiased;
}
header{display:flex;align-items:center;justify-content:space-between;padding:22px clamp(20px,5vw,64px)}
.brand{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;display:flex;align-items:center;gap:10px}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--asphalt);position:relative;display:block}
.brand i::after{content:"";position:absolute;left:50%;top:4px;bottom:4px;width:2px;transform:translateX(-50%);
  background:repeating-linear-gradient(var(--paint) 0 4px,transparent 4px 8px)}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:8px clamp(20px,5vw,64px) 56px}
.container{position:relative;width:100%;max-width:520px;background:var(--asphalt);color:var(--chalk);
  border-radius:20px;padding:38px 34px 38px 52px;box-shadow:0 30px 60px -30px rgba(20,22,25,.55);overflow:hidden}
.container::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:3px;
  background:repeating-linear-gradient(to bottom,var(--paint) 0 16px,transparent 16px 30px)}

h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(34px,6vw,48px);line-height:.95;margin-bottom:14px}
p{font-size:16px;line-height:1.5;color:var(--muted)}

.spinner{width:44px;height:44px;border-radius:50%;margin:26px 0;
  border:4px solid var(--tarmac-2);border-top-color:var(--paint);animation:spin 1s linear infinite}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}

#status-text{display:block;background:var(--tarmac);border-radius:12px;padding:14px 18px;
  font-size:15px;font-weight:500;color:var(--chalk)}

@media (max-width:640px){
  .container{padding:28px 20px 28px 38px}
  .container::before{left:16px}
}
</style>
</head>
<body>
    <header>
        <div class="brand"><i></i>Road Defect Detection</div>
    </header>

    <main>
        <div class="container">
            <h2>Processing Road Audit...</h2>
            <p>Your dashcam video or GPS telemetry is running asynchronously via background jobs.</p>
            <div class="spinner"></div>
            <p id="status-text" role="status" aria-live="polite">Status: Initializing background processing...</p>
        </div>
    </main>

    <script>
        const jobId = "{{ job_id }}";

        function pollJob() {
            fetch(`/api/jobs/${jobId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'completed') {
                        document.getElementById('status-text').innerText = "Processing complete! Loading results...";
                        // Redirects to the result dashboard page instead of forcing a direct PDF download
                        window.location.href = `/result/${jobId}`;
                    } else if (data.status === 'failed') {
                        document.getElementById('status-text').innerText = "Error: " + data.error;
                        document.getElementById('status-text').style.color = "#ff7b66";
                    } else {
                        document.getElementById('status-text').innerText = "Status: " + (data.progress || "Running model pipeline...");
                        setTimeout(pollJob, 2000);
                    }
                })
                .catch(err => {
                    console.error("Polling error:", err);
                    setTimeout(pollJob, 3000);
                });
        }

        setTimeout(pollJob, 2000);
    </script>
</body>
</html>
